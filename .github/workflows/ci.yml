name: Vyavahaar Cross-Platform CI

on:
  push:
    branches: [ main, migration/flutter-only ]
  pull_request:
    branches: [ main, migration/flutter-only ]

jobs:
  flutter-verify:
    name: Flutter Cross-Platform Verification & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Database Architecture Stress Tests
        run: python3 scripts/test-database-architecture.py

      - name: Run Multilingual Architecture Verification
        run: python3 scripts/test-multilingual-architecture.py

      - name: Run Contacts & People Management Verification
        run: python3 scripts/test-contacts-and-people-architecture.py

      - name: Run Advanced Event Architecture Verification
        run: python3 scripts/test-advanced-event-architecture.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs --verbose

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit Tests
        run: flutter test --coverage
