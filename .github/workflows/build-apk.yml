name: Build Vyavahaar Android APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Verify Android Platform Wrapper
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.procsctools --no-pub .
          fi

      - name: Configure Android Keystore & Signing
        run: |
          mkdir -p android/app
          if [ -f "scripts/upload-keystore.b64" ]; then
            echo "Loading persistent upload keystore from scripts/upload-keystore.b64"
            base64 -d scripts/upload-keystore.b64 > android/app/upload-keystore.jks
          else
            echo "Generating new persistent upload keystore"
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias vyavahaarkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass vyavahaar123 \
              -keypass vyavahaar123 \
              -dname "CN=Vyavahaar, OU=Mobile, O=Vyavahaar, L=Jaipur, ST=Rajasthan, C=IN"
            base64 -w 0 android/app/upload-keystore.jks > scripts/upload-keystore.b64
          fi

          cat << 'EOF' > android/key.properties
          storePassword=vyavahaar123
          keyPassword=vyavahaar123
          keyAlias=vyavahaarkey
          storeFile=upload-keystore.jks
          EOF
          ls -la android/app/upload-keystore.jks android/key.properties

      - name: Configure Android compileSdk to 36 & Packaging
        run: python3 scripts/configure-android-sdk.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs --verbose

      - name: Build Debug APK
        run: |
          flutter build apk --debug --verbose --android-skip-build-dependency-validation || (cd android && ./gradlew assembleDebug -Pandroid.skipBuildDependencyValidation=true && cd ..)
          echo "Locating generated Debug APK:"
          mkdir -p build/app/outputs/flutter-apk/
          DEBUG_APK=$(find . -name "*debug*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            echo "Copying $DEBUG_APK to build/app/outputs/flutter-apk/app-debug.apk"
            cp "$DEBUG_APK" build/app/outputs/flutter-apk/app-debug.apk
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
          else
            echo "ERROR: No Debug APK found after build!"
            exit 1
          fi

      - name: Build Release APK
        run: |
          flutter build apk --release --verbose --android-skip-build-dependency-validation || (cd android && ./gradlew assembleRelease -Pandroid.skipBuildDependencyValidation=true && cd ..)
          mkdir -p build/app/outputs/flutter-apk/
          RELEASE_APK=$(find . -name "*release*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            echo "Copying $RELEASE_APK to build/app/outputs/flutter-apk/app-release.apk"
            cp "$RELEASE_APK" build/app/outputs/flutter-apk/app-release.apk
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            echo "WARN: Release APK not generated by flutter build, attempting assembleRelease..."
            cd android && ./gradlew assembleRelease -Pandroid.skipBuildDependencyValidation=true && cd ..
            RELEASE_APK=$(find . -name "*release*.apk" -not -path "*/intermediates/*" | head -n 1)
            if [ -n "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" build/app/outputs/flutter-apk/app-release.apk
            fi
          fi

      - name: Sign & Verify APKs with apksigner (V1 + V2 + V3 Schemes)
        run: |
          echo "=== Locating apksigner and zipalign in Android SDK ==="
          APKSIGNER=$(which apksigner 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(which zipalign 2>/dev/null || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name zipalign 2>/dev/null | sort -V | tail -n 1)
          echo "Found apksigner: $APKSIGNER"
          echo "Found zipalign: $ZIPALIGN"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in Android SDK!"
            exit 1
          fi

          echo "=== 1. Signing Release APK ==="
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -c 4 build/app/outputs/flutter-apk/app-release.apk || {
                echo "Zipaligning Release APK..."
                $ZIPALIGN -p -f 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-aligned.apk
                mv -f build/app/outputs/flutter-apk/app-release-aligned.apk build/app/outputs/flutter-apk/app-release.apk
              }
            fi
            $APKSIGNER sign \
              --ks android/app/upload-keystore.jks \
              --ks-key-alias vyavahaarkey \
              --ks-pass pass:vyavahaar123 \
              --key-pass pass:vyavahaar123 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              build/app/outputs/flutter-apk/app-release.apk

            echo "=== Verifying Release APK Signature Schemes ==="
            $APKSIGNER verify --verbose build/app/outputs/flutter-apk/app-release.apk
            echo "✅ Release APK verified successfully!"
          fi

          echo "=== 2. Signing Debug APK ==="
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -c 4 build/app/outputs/flutter-apk/app-debug.apk || {
                echo "Zipaligning Debug APK..."
                $ZIPALIGN -p -f 4 build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-debug-aligned.apk
                mv -f build/app/outputs/flutter-apk/app-debug-aligned.apk build/app/outputs/flutter-apk/app-debug.apk
              }
            fi
            $APKSIGNER sign \
              --ks android/app/upload-keystore.jks \
              --ks-key-alias vyavahaarkey \
              --ks-pass pass:vyavahaar123 \
              --key-pass pass:vyavahaar123 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              build/app/outputs/flutter-apk/app-debug.apk

            echo "=== Verifying Debug APK Signature Schemes ==="
            $APKSIGNER verify --verbose build/app/outputs/flutter-apk/app-debug.apk
            echo "✅ Debug APK verified successfully!"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyavahaar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyavahaar-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Persist Keystore in Repository
        run: |
          if [ -f "scripts/upload-keystore.b64" ] && [ -n "$(git status --porcelain scripts/upload-keystore.b64)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/upload-keystore.b64
            git commit -m "chore(ci): persist deterministic release upload-keystore [skip ci]" || true
            git push origin HEAD:${{ github.ref }} || true
          fi

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets/
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp -f "build/app/outputs/flutter-apk/app-debug.apk" release-assets/
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp -f "build/app/outputs/flutter-apk/app-release.apk" release-assets/
          fi
          ls -lh release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/migration/flutter-only' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-preview' }}
          name: "व्यवहार (Vyavahaar) ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0 Preview' }}"
          body: |
            ### 📱 व्यवहार (Vyavahaar) — Digital Family Ledger
            *रिश्तों का हिसाब, हमेशा याद।*

            #### ⚠️ इंस्टॉलेशन निर्देश (Installation & Fix for 'App not installed'):
            1. **पुराना ऐप अनइंस्टॉल करें**: यदि आपके फ़ोन में पहले से "व्यवहार" या कोई पुराना टेस्ट APK इंस्टॉल है, तो कृपया नए APK को इंस्टॉल करने से पहले **Settings ➔ Apps** से पुराना ऐप अनइंस्टॉल (Uninstall) अवश्य कर दें। Android सुरक्षा कारणों से अलग सिग्नेचर वाले ऐप को ओवरराइट नहीं करने देता।
            2. **साइंड APK (Signed APKs)**: नीचे दिए गए दोनों APK पूरी तरह हस्ताक्षरित (Signed with v1 + v2 certificates) हैं।
            3. **Google Play Protect**: यदि इंस्टॉल करते समय "Play Protect has blocked this app" या चेतावनी आए, तो **"More details"** (अधिक विवरण) पर टैप करके **"Install anyway"** (फिर भी इंस्टॉल करें) चुनें।

            #### ✨ प्रमुख विशेषताएं (Features):
            - **100% ऑफ़लाइन व सुरक्षित SQLite** (AES-256-GCM एन्क्रिप्टेड बैकअप)
            - **हिंदी एवं 22 भारतीय भाषाएँ** (Zero Hardcoded strings)
            - **लाइट व डार्क मोड** (18+ सुंदर थीम पैलेट्स)
            - **PDF बही खाता प्रिंटिंग (A4) एवं Excel CSV निर्यात**
            - **मिला / दिया शगुन स्पष्टता** (Mila व Diya हमेशा अलग)
            - **InlitX/streak टैक्टाइल स्प्रिंग बटन एवं डेस्कटॉप स्प्लिट-व्यू**

            #### 📥 Direct APK Downloads:
            - **`app-release.apk`** — प्रोडक्शन ऑप्टिमाइज़्ड हस्ताक्षरित (Signed Universal Release APK)
            - **`app-debug.apk`** — यूनिवर्सल डीबग बिल्ड (Signed Debug APK)
          files: release-assets/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
