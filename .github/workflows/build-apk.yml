name: Build Vyavahaar Android APK

on:
  push:
    branches: [ migration/flutter-only, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Wrapper
        run: flutter create --platforms=android --org com.vyavahaar --no-pub .

      - name: Configure Android compileSdk to 36
        run: python3 scripts/configure-android-sdk.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs --verbose

      - name: Build Debug APK
        run: |
          flutter build apk --debug --verbose || (cd android && ./gradlew assembleDebug && cd ..)
          echo "Locating generated APKs:"
          find . -name "*.apk" -exec ls -lh {} +
          mkdir -p build/app/outputs/flutter-apk/
          APK_FILE=$(find . -name "*debug*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Copying $APK_FILE to build/app/outputs/flutter-apk/app-debug.apk"
            cp "$APK_FILE" build/app/outputs/flutter-apk/app-debug.apk
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
          else
            echo "ERROR: No APK found after build!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyavahaar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK
        run: |
          flutter build apk --release --no-shrink || (cd android && ./gradlew assembleRelease && cd ..)
          mkdir -p build/app/outputs/flutter-apk/
          RELEASE_APK=$(find . -name "*release*.apk" -not -path "*/intermediates/*" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            echo "Copying $RELEASE_APK to build/app/outputs/flutter-apk/app-release.apk"
            cp "$RELEASE_APK" build/app/outputs/flutter-apk/app-release.apk
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          fi
        continue-on-error: true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyavahaar-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets/
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp -f "build/app/outputs/flutter-apk/app-debug.apk" release-assets/
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp -f "build/app/outputs/flutter-apk/app-release.apk" release-assets/
          fi
          ls -lh release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/migration/flutter-only' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-preview' }}
          name: "व्यवहार (Vyavahaar) ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0 Preview' }}"
          body: |
            ### 📱 व्यवहार (Vyavahaar) — Digital Family Ledger
            *रिश्तों का हिसाब, हमेशा याद।*

            #### ✨ What's Included:
            - **100% Offline & Private SQLite** (Encrypted AES-256 backup)
            - **Pure English & 22 Scheduled Indian Languages** (Zero Hardcoded strings)
            - **Light / Dark Mode & 18+ Beautiful Theme Palettes**
            - **PDF Ledger Printing (A4) & Excel CSV Export**
            - **Mila / Diya Financial Clarity (Never netted)**

            #### 📥 Direct APK Downloads:
            - **`app-debug.apk`** — Universal build (Recommended: install directly on any Android)
            - **`app-release.apk`** — Production optimized release build
          files: release-assets/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
