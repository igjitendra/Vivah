name: vyavahaar
description: "व्यवहार (Vyavahaar) — Digital Family Ledger. रिश्तों का हिसाब, हमेशा याद।"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # Declarative Routing
  go_router: ^14.2.0

  # Type-Safe SQLite Persistence
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.0
  path: ^1.9.0

  # Models & Immutability
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Cryptography & Security (100% Offline AES-256-GCM + PBKDF2)
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.0.0

  # Document Generation & File Handling
  pdf: ^3.10.0
  printing: ^5.11.0
  csv: ^6.0.0
  file_picker: ^8.3.7
  share_plus: ^10.0.0

  # Formatting & Localization
  intl: any

  # UUID generation for primary keys
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.8
  drift_dev: ^2.20.0

  # Testing & Mocking
  mocktail: ^1.0.3

  # Static Analysis
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/brand/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansDevanagari-ExtraBold.ttf
          weight: 800
